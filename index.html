  body.append(c)})}
function byVerein(list,out){
 Object.keys(CC).forEach(cn=>{
  const vs=[...new Set(list.filter(e=>e.c===cn).map(e=>e.v))].sort((a,b)=>a.localeCompare(b,'de'));
  if(!vs.length)return;
  out.append(el('h2','grp',cn,col(cn)));
  vs.forEach(v=>{const es=list.filter(e=>e.v===v);
   const card=el('div','card',null,col(cn));const h=el('h3',null,v);h.append(el('small',null,es.length+(es.length===1?' Termin':' Termine')));
   const ul=el('ul');es.forEach(e=>{const li=el('li');const dw=WD[new Date(2027,e.m-1,e.d).getDay()];
    li.append(el('time',null,dw+' '+dstr(e)),el('span',null,e.t+(e.d2?' (bis '+pad(e.d2)+'.'+pad(e.m2)+'.)':'')));ul.append(li)});
   card.append(h,ul);out.append(card)})})}
